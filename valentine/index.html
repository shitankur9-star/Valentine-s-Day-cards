<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine Card Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header><div class="brand"><span>♥</span> CARD STUDIO</div><div class="save">● Changes saved</div></header>
    <section class="workspace">
      <aside class="editor" aria-label="Card editor">
        <p class="eyebrow">CREATE SOMETHING LOVELY</p>
        <h1>Make their day<br><em>a little brighter.</em></h1>
        <label>TO<input id="recipient" maxlength="80" value="Ankur" placeholder="Their name" /></label>
        <label>YOUR MESSAGE<textarea id="message" maxlength="500" placeholder="Write something from the heart...">Every day with you is my favorite story. Happy Valentine's Day!</textarea><small id="count">0 / 500</small></label>
        <label>FROM<input id="sender" maxlength="80" value="Shital" placeholder="Your name" /></label>
        <div class="template-label">CHOOSE A MOOD</div>
        <div class="swatches" id="swatches">
          <button class="swatch rose active" data-theme="rose" aria-label="Rose"></button>
          <button class="swatch night" data-theme="night" aria-label="Midnight"></button>
          <button class="swatch peach" data-theme="peach" aria-label="Peach"></button>
          <button class="swatch meadow" data-theme="meadow" aria-label="Meadow"></button>
        </div>
      </aside>
      <section class="preview-area">
        <div class="preview-top"><span>LIVE PREVIEW</span><span id="previewSize">4:3 • Standard</span></div>
        <div class="card-stage"><canvas id="preview" width="1600" height="1200" aria-label="Your card preview"></canvas></div>
      </section>
      <aside class="export-panel">
        <div class="export-heading"><span class="download-icon">↓</span><div><p class="eyebrow">READY TO SHARE?</p><h2>Export Your Card</h2></div></div>
        <label>FORMAT<select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="pdf">PDF</option></select></label>
        <label>SIZE<select id="size"><option value="standard">Standard 4:3</option><option value="portrait">Instagram Portrait 4:5</option><option value="story">Story / Status 9:16</option><option value="square">Square 1:1</option><option value="print">Print 8.5 × 11 in</option></select></label>
        <label id="qualityField">QUALITY<select id="quality"><option value="0.85">Standard — 85%</option><option value="0.95" selected>High — 95%</option><option value="1">Maximum — 100%</option></select></label>
        <div id="pdfType" class="pdf-types" hidden><button class="pdf-choice active" data-pdf="digital">Digital PDF<small>Card-size page</small></button><button class="pdf-choice" data-pdf="print">Print PDF<small>Letter • 300 DPI</small></button></div>
        <button id="download" class="download">↓&nbsp; Download PNG</button>
        <p id="status" class="status" role="alert"></p>
        <div class="note"><b>Export tip</b><br>Artwork is rendered fresh at your chosen resolution. Nothing from this editor is included.</div>
      </aside>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
